name: Build and boot-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib grub-pc-bin xorriso mtools qemu-system-x86 make

      - name: Build bootable ISO
        run: |
          make clean
          make check-tools
          make

      - name: Verify Multiboot header
        run: grub-file --is-x86-multiboot build/kernel.elf

      - name: Boot kernel in headless QEMU
        run: make test

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: michael-oc-iso
          path: build/michael-oc.iso
          if-no-files-found: error
